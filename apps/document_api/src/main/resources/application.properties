spring.application.name=document_api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electronic_document_workflow}
spring.datasource.username=${DB_USER:document_api}
spring.datasource.password=${DB_PASSWORD:document_api}
spring.jpa.properties.hibernate.default_schema=core

spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.default-schema=core
spring.liquibase.contexts=${DOCUMENT_API_LIQUIBASE_CONTEXTS:demo}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:10681/realms/document-workflow}

# Originy przeglądarki document_web dopuszczone przez CORS (dev `ng serve` i build serwowany przez
# kontener) - rozdzielone przecinkiem, zob. SecurityConfig.corsConfigurationSource.
cors.allowed-origins=${DOCUMENT_WEB_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:10600}

dms.service.base-url=${DMS_SERVICE_BASEURL:http://localhost:10621}
sign.service.base-url=${SIGN_SERVICE_BASEURL:http://localhost:10623}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
