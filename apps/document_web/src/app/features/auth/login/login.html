<div id="login-strona" class="login-page">
  <div class="login-image">
    <img src="login.jpg" alt="System księgowo-administracyjny" />
  </div>

  <div class="login-form-panel">
    <div id="login-panel" class="login-form">
      <img src="document.png" alt="Logo systemu" class="login-logo" />
      <h1>Elektroniczny Obieg Dokumentów</h1>
      <p class="subtitle">Zaloguj się do systemu księgowo-administracyjnego</p>

      <button
        id="login-przycisk-zaloguj"
        type="button"
        pButton
        label="Zaloguj przez Keycloak"
        class="login-submit"
        (click)="zaloguj()"
      ></button>
    </div>
  </div>
</div>
