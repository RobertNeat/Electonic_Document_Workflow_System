<h2 id="struktura-tytul">Struktura organizacyjna</h2>
<p class="podtytul">Wydziały i przypisane do nich stanowiska.</p>

<p-tree id="struktura-drzewo" [value]="wezly">
  <ng-template #node let-node>
    <span>{{ node.label }}</span>
    @if (node.data?.kierownik) {
      <span class="kierownik"> — kierownik: {{ node.data.kierownik }}</span>
    }
  </ng-template>
</p-tree>
