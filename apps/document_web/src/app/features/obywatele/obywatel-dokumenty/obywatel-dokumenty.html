<p-table id="obywatel-dokumenty-tabela" [value]="dokumenty()" dataKey="id" [rowHover]="true">
  <ng-template #header>
    <tr>
      <th>Nazwa</th>
      <th>Typ</th>
      <th>Sprawa</th>
      <th>Wersja</th>
      <th>Data utworzenia</th>
    </tr>
  </ng-template>
  <ng-template #body let-dokument>
    <tr>
      <td>{{ dokument.nazwa }}</td>
      <td>{{ dokument.typNazwa }}</td>
      <td>{{ dokument.znakSprawy }}</td>
      <td>{{ dokument.aktualnaWersja }}</td>
      <td>{{ dokument.dataUtworzenia | date: 'dd.MM.yyyy' }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5">Brak dokumentów powiązanych ze sprawami tego obywatela.</td>
    </tr>
  </ng-template>
</p-table>
