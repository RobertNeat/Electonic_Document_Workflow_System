spring.application.name=dms_service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electronic_document_workflow}
spring.datasource.username=${DB_USER:dms_service}
spring.datasource.password=${DB_PASSWORD:dms_service}
spring.jpa.properties.hibernate.default_schema=dms

spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.default-schema=dms

dms.storage.base-path=${DMS_STORAGE_PATH:/data/dms}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
