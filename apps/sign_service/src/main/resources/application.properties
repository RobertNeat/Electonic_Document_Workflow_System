spring.application.name=sign_service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electronic_document_workflow}
spring.datasource.username=${DB_USER:sign_service}
spring.datasource.password=${DB_PASSWORD:sign_service}
spring.jpa.properties.hibernate.default_schema=pki

spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.default-schema=pki

# Haslo do PKCS12 keystore'ow demo-CA/certyfikatow leaf - tylko do uzytku demonstracyjnego,
# nigdy nie zahardkodowane w kodzie.
sign.pki.keystore-password=${SIGN_SERVICE_KEYSTORE_PASSWORD:demo-keystore-password}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
