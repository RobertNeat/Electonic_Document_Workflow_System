spring.application.name=delivery_mock
server.port=${SERVER_PORT:10624}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electronic_document_workflow}
spring.datasource.username=${DB_USER:delivery_mock}
spring.datasource.password=${DB_PASSWORD:delivery_mock}
spring.jpa.properties.hibernate.default_schema=delivery

spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.default-schema=delivery

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

document.api.base-url=${DOCUMENT_API_URL:http://localhost:10620}

# Client-credentials do document_api (resource server Keycloak) - zob. DocumentApiClient.
spring.security.oauth2.client.registration.document-api.provider=keycloak
spring.security.oauth2.client.registration.document-api.client-id=delivery-mock-service
spring.security.oauth2.client.registration.document-api.client-secret=${DELIVERY_MOCK_SERVICE_CLIENT_SECRET:change-me}
spring.security.oauth2.client.registration.document-api.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:10681/realms/document-workflow/protocol/openid-connect/token}
